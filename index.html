<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirco Moreyra · Editor de video</title>
<meta name="description" content="Adaptado de cualquier tipo de contenido.">
<style>
:root{
  --text:#f5f6ff; --muted:rgba(245,246,255,.66);
  --stroke:rgba(255,255,255,.2);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--text); background:#0a0a17;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body.locked{overflow:hidden}

/* ---------- Fondo con manchas de color (lo que hace brillar el vidrio) ---------- */
.bg{position:fixed; inset:0; z-index:-1; overflow:hidden}
.bg i{position:absolute; border-radius:50%; filter:blur(90px); opacity:.65; animation:float 22s ease-in-out infinite alternate; will-change:transform,translate}
.bg i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:#6d4aff}
.bg i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:10vh;background:#ff4f9a;animation-delay:-6s}
.bg i:nth-child(3){width:50vw;height:50vw;left:25vw;bottom:-25vw;background:#18c6ff;animation-delay:-12s}
.bg i:nth-child(4){width:30vw;height:30vw;right:15vw;bottom:5vh;background:#ffb347;opacity:.4;animation-delay:-3s}
@keyframes float{to{transform:translate(6vw,5vh) scale(1.15)}}

/* ---------- Liquid glass ---------- */
.glass{
  position:relative;
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--stroke);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(255,255,255,.08),
    inset 0 0 24px rgba(255,255,255,.05),
    0 12px 40px rgba(0,0,0,.35);
  border-radius:26px;
}
/* reflejo especular que sigue al mouse */
.glass::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.22),transparent 60%);
  opacity:0; transition:opacity .3s;
}
.glass:hover::after{opacity:1}

/* ---------- Layout ---------- */
.wrap{max-width:1700px; margin:0 auto; padding:0 20px}
nav{position:sticky; top:14px; z-index:20; margin:14px auto 0; width:fit-content; max-width:calc(100% - 24px);
  display:flex; align-items:center; justify-content:center; padding:7px 8px; border-radius:999px;
  animation:drop .9s var(--ease) both}
nav .links{display:flex; gap:4px; flex-wrap:wrap; justify-content:center}
nav a{color:var(--text); text-decoration:none; font-size:14px; padding:7px 14px; border-radius:999px; transition:background .2s}
nav a:hover{background:rgba(255,255,255,.14)}

.hero{padding:56px 0 36px; text-align:center; display:flex; flex-direction:column; align-items:center}
.avatar{width:144px; height:144px; border-radius:50%; padding:6px; margin-bottom:26px;
  animation:rise 1s var(--ease) .1s both, bob 6s ease-in-out 1.2s infinite alternate}
.avatar-in{width:100%; height:100%; border-radius:50%; overflow:hidden; display:grid; place-items:center;
  font-size:48px; font-weight:700; letter-spacing:-.04em; background:linear-gradient(135deg,#7b5cff,#ff5fa2)}
.avatar-in img{width:100%; height:100%; object-fit:cover; display:block}
.hero h1{font-size:clamp(40px,8vw,84px); line-height:1.02; letter-spacing:-.045em; margin:0 0 16px;
  background:linear-gradient(180deg,#fff,rgba(255,255,255,.62)); -webkit-background-clip:text; background-clip:text; color:transparent}
.role{display:inline-block; font-size:13px; letter-spacing:.14em; text-transform:uppercase; padding:7px 18px; margin-bottom:20px; border-radius:999px;
  background:rgba(255,255,255,.1); border:1px solid var(--stroke); box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
.hero p{max-width:620px; margin:0 auto; color:var(--muted); font-size:clamp(16px,2vw,19px); line-height:1.55}

.filters{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:30px 0 34px}
.chip{
  font:inherit; font-size:14px; color:var(--text); cursor:pointer; padding:9px 18px; border-radius:999px;
  background:rgba(255,255,255,.07); border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35); transition:all .2s;
}
.chip:hover{background:rgba(255,255,255,.16)}
.chip.on{background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.5); box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 22px rgba(255,255,255,.18)}
.chip small{opacity:.6; margin-left:4px}

/* masonry: mezcla verticales y horizontales sin huecos */
.grid{display:grid; grid-template-columns:repeat(var(--cols,4),minmax(0,1fr)); gap:22px; align-items:start; padding-bottom:60px;
  --cols:4; --th:200px} /* --cols y --th (alto común de las portadas) los calcula el script según el ancho de pantalla */
.card{min-width:0}
/* horizontales: portada arriba, info abajo. reels y cuadrados: misma altura de portada, con la info al costado */
.card.v,.card.s{display:flex; gap:12px}
.card.v .thumb,.card.s .thumb{flex:none; height:var(--th); aspect-ratio:auto}
.card.v .thumb{--w:min(calc((var(--th) + var(--info-h)) * 9 / 16), calc(var(--th) * .82)); width:var(--w); height:calc(var(--w) * 16 / 9)}
.card.s .thumb{width:var(--th)}
.card.v .info,.card.s .info{flex:1; min-width:0; padding:4px 4px 4px 0}
.card.v .fmt{display:none}
.card.v .play span{width:42px; height:42px}
.card.v .play svg{width:17px; height:17px}
.card{padding:10px; cursor:pointer; flex:none;
  transition:transform .45s var(--ease),opacity .9s var(--ease) var(--d,0s),translate .9s var(--ease) var(--d,0s),scale .9s var(--ease) var(--d,0s)}
.card.reveal{opacity:0; translate:0 40px; scale:.95}
.card.reveal.in{opacity:1; translate:0 0; scale:1}
.card:hover{transform:translateY(-6px) scale(1.012)}
.thumb{position:relative; width:100%; overflow:hidden; border-radius:18px; background:#111}
.thumb.h{aspect-ratio:16/9}
.thumb.v{aspect-ratio:9/16}
.thumb.s{aspect-ratio:1/1}
.thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s}
.card:hover .thumb img{transform:scale(1.05)}
.play{position:absolute; inset:0; display:grid; place-items:center}
.play span{width:56px; height:56px; border-radius:50%; display:grid; place-items:center;
  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7); opacity:0; transform:scale(.85); transition:all .3s}
.card:hover .play span{opacity:1; transform:none}
.play svg{width:22px; height:22px; fill:#fff; margin-left:3px}
.dur{position:absolute; right:10px; bottom:10px; font-size:12px; font-weight:600; padding:4px 9px; border-radius:999px;
  background:rgba(0,0,0,.45); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.2)}
.fmt{position:absolute; left:10px; top:10px; font-size:11px; padding:3px 9px; border-radius:999px;
  background:rgba(0,0,0,.4); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.18)}

.info{padding:12px 8px 6px}
.info h3{margin:0 0 4px; font-size:17px; letter-spacing:-.01em}
.meta{font-size:13px; color:var(--muted)}
.meta b{color:var(--text); font-weight:600}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tag{font-size:11.5px; padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16)}
.tools{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
.tool{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; font-size:12px; font-weight:800;
  letter-spacing:-.04em; overflow:hidden}
.tool img{width:100%; height:100%; object-fit:cover}
.empty{text-align:center; color:var(--muted); padding:60px 0}

footer{text-align:center; color:var(--muted); font-size:13px; padding:20px 0 40px}

/* ---------- Modal ---------- */
.overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px;
  background:rgba(5,5,15,.55); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
.overlay.open{display:flex; animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{width:min(1100px,100%); max-height:92vh; overflow:auto; padding:18px; animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(20px) scale(.97); opacity:0}}
.close{position:absolute; top:14px; right:14px; z-index:3; width:38px; height:38px; border-radius:50%; cursor:pointer; color:#fff; font-size:20px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
.close:hover{background:rgba(255,255,255,.3)}
.mbody{display:grid; gap:24px; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); align-items:start}
.mbody.vert{grid-template-columns:auto minmax(0,1fr)}
.player{position:relative; width:100%; border-radius:18px; overflow:hidden; background:#000; aspect-ratio:16/9}
.player.v{aspect-ratio:9/16; height:min(78vh,720px); width:auto}
.player.s{aspect-ratio:1/1}
.player iframe,.player video{position:absolute; inset:0; width:100%; height:100%; border:0}
.player .ph{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px; color:var(--muted); gap:12px}
.btn{display:inline-block; color:#fff; text-decoration:none; padding:10px 20px; border-radius:999px; font-size:14px; cursor:pointer;
  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.btn:hover{background:rgba(255,255,255,.32)}
.minfo{padding:8px 6px}
.minfo h2{margin:0 0 6px; font-size:clamp(22px,3vw,30px); letter-spacing:-.03em; line-height:1.1}
.facts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0}
.fact{padding:10px 14px; border-radius:16px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12)}
.fact small{display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px}
.desc{color:rgba(245,246,255,.85); line-height:1.65; font-size:15px}
.desc p{margin:0 0 12px}
.mtools{display:flex; flex-direction:column; gap:8px; margin-top:16px}
.mtool{display:flex; align-items:center; gap:10px; font-size:14px}
@media(max-width:820px){
  .mbody,.mbody.vert{grid-template-columns:1fr}
  .player.v{height:auto; width:min(100%,340px); margin:0 auto}
  nav a{padding:7px 11px; font-size:13px}
}

/* ---------- Editor (solo con #editor en la URL) ---------- */
.fab{position:fixed; right:18px; bottom:18px; z-index:40; display:none}
body.edit .fab{display:block}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(440px,100%); z-index:60; padding:20px; overflow:auto; transform:translateX(105%); transition:transform .35s; border-radius:26px 0 0 26px}
.drawer.open{transform:none}
.drawer h2{margin:0 0 4px}
.drawer label{display:block; font-size:12px; color:var(--muted); margin:12px 0 4px}
.drawer input,.drawer select,.drawer textarea{width:100%; font:inherit; font-size:14px; color:#fff; padding:9px 12px; border-radius:12px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); outline:none}
.drawer input:focus,.drawer select:focus,.drawer textarea:focus{border-color:rgba(255,255,255,.6)}
.drawer select option{color:#111}
.drawer input[type=date]{color-scheme:dark}
.drawer textarea{min-height:80px; resize:vertical}
.checks{display:flex; flex-wrap:wrap; gap:8px}
.checks label{display:flex; align-items:center; gap:6px; margin:0; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--text); cursor:pointer}
.checks input{width:auto}
.out{font-family:ui-monospace,Menlo,monospace; font-size:12px; min-height:140px}
.row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
/* ---------- Destacados: brillo dorado dentro de la tarjeta ---------- */
.card.gold{
  overflow:hidden;
  border-color:rgba(255,213,100,.8);
  background:linear-gradient(135deg,rgba(255,215,120,.24),rgba(255,176,40,.07));
  box-shadow:
    inset 0 1px 0 rgba(255,240,190,.85),
    inset 0 0 30px rgba(255,200,70,.38),
    inset 0 0 80px rgba(255,165,30,.14),
    0 12px 40px rgba(0,0,0,.35);
  animation:goldPulse 3.8s ease-in-out infinite alternate;
}
@keyframes goldPulse{
  from{box-shadow:inset 0 1px 0 rgba(255,240,190,.7),inset 0 0 22px rgba(255,200,70,.26),inset 0 0 60px rgba(255,165,30,.08),0 12px 40px rgba(0,0,0,.35)}
  to{box-shadow:inset 0 1px 0 rgba(255,245,205,.95),inset 0 0 38px rgba(255,205,80,.5),inset 0 0 95px rgba(255,170,30,.2),0 12px 40px rgba(0,0,0,.35)}
}
/* destello que cruza la tarjeta: una franja que se desliza y se desvanece (sin saltos al reiniciar) */
.card.gold::before{
  content:""; position:absolute; top:-10%; bottom:-10%; left:-60%; width:50%; z-index:3; pointer-events:none; opacity:0;
  background:linear-gradient(100deg,transparent,rgba(255,238,175,.42) 50%,transparent);
  transform:skewX(-18deg);
  animation:sheen 6.5s linear infinite;
  animation-delay:calc(var(--d,0s)*8);
}
@keyframes sheen{
  0%,40%{translate:0 0; opacity:0; animation-timing-function:cubic-bezier(.45,0,.25,1)}
  48%{opacity:1}
  90%{opacity:1}
  100%{translate:440% 0; opacity:0}
}
.card.gold .info h3{color:#ffe7a3; text-shadow:0 0 18px rgba(255,200,70,.35)}
.card.gold .tag{background:rgba(255,205,90,.16); border-color:rgba(255,215,120,.4)}
.star{position:absolute; right:10px; top:10px; z-index:2; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  font-size:14px; color:#4a3000; background:linear-gradient(135deg,#fff1b8,#ffc93c); box-shadow:0 0 14px rgba(255,200,60,.8),inset 0 1px 0 rgba(255,255,255,.8)}
.chip.feat{color:#ffe7a3; border-color:rgba(255,213,100,.65); background:rgba(255,200,70,.14); box-shadow:inset 0 1px 0 rgba(255,240,190,.6),0 0 18px rgba(255,190,50,.22)}
.chip.feat.on{background:rgba(255,205,80,.32); border-color:rgba(255,225,130,.95); box-shadow:inset 0 1px 0 rgba(255,245,205,.9),0 0 26px rgba(255,190,50,.45)}

/* ---------- Redes sociales ---------- */
.socials{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:26px}
.social{width:46px; height:46px; border-radius:50%; display:grid; place-items:center; color:var(--text); text-decoration:none;
  font-size:15px; font-weight:700; transition:transform .35s var(--ease)}
.social:hover{transform:translateY(-4px) scale(1.1)}
.social svg{width:21px; height:21px; display:block}
.social b{letter-spacing:-.03em}
.filters{scroll-margin-top:90px}
#grid{min-height:calc(100vh - 170px)} /* deja siempre espacio para que el paneo pueda subir los filtros, aunque la sección tenga pocos videos */

/* ---------- Animaciones ---------- */
:root{--ease:cubic-bezier(.2,.9,.25,1)}
@keyframes rise{from{opacity:0; transform:translateY(26px) scale(.97); filter:blur(10px)}}
@keyframes drop{from{opacity:0; transform:translateY(-30px)}}
@keyframes bob{to{translate:0 -9px}}
/* foto de perfil: al tocarla rebota (salta, se aplasta y se estira) */
.avatar.tap{cursor:pointer; -webkit-tap-highlight-color:transparent}
.avatar.boing{animation:rise 1s var(--ease) .1s both, bob 6s ease-in-out 1.2s infinite alternate, boing .95s cubic-bezier(.3,.7,.4,1)}
@keyframes boing{
  0%{transform:scale(1,1)}
  12%{transform:translateY(4px) scale(1.14,.84)}
  30%{transform:translateY(-38px) scale(.9,1.12)}
  48%{transform:translateY(0) scale(1.1,.9)}
  62%{transform:translateY(-14px) scale(.97,1.04)}
  78%{transform:translateY(0) scale(1.04,.96)}
  90%{transform:translateY(-4px) scale(1)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes fadeout{to{opacity:0}}
@keyframes popout{to{transform:translateY(16px) scale(.97); opacity:0}}
.rise{animation:rise 1s var(--ease) both; animation-delay:var(--d,0s)}
/* parallax suave de las manchas de fondo */
.bg i{translate:calc(var(--px,0)*var(--k,30)*1px) calc(var(--py,0)*var(--k,30)*1px); transition:translate 1.6s var(--ease)}
.bg i:nth-child(2){--k:-50}
.bg i:nth-child(3){--k:60}
.bg i:nth-child(4){--k:-25}
.grid{transition:opacity .18s}
.grid.swap{opacity:0}
.chip{transition:all .25s var(--ease)}
.chip:active{transform:scale(.94)}
.tool{transition:transform .25s var(--ease)}
.tool:hover{transform:translateY(-3px) scale(1.14)}
.play span{transition:all .45s var(--ease)}
.overlay.closing{animation:fadeout .22s both}
.overlay.closing .panel{animation:popout .22s both}
.player,.minfo>*{animation:rise .7s var(--ease) both}
.player{animation-delay:.1s}
.minfo>:nth-child(1){animation-delay:.16s}
.minfo>:nth-child(2){animation-delay:.22s}
.minfo>:nth-child(3){animation-delay:.28s}
.minfo>:nth-child(4){animation-delay:.34s}
.minfo>:nth-child(5){animation-delay:.4s}
.minfo>:nth-child(6){animation-delay:.46s}
/* ---------- Galería de imágenes dentro del proyecto ---------- */
.media{min-width:0}
.gstage{position:relative}
.player.gimg{background:#05060d; touch-action:pan-y}
.player.gimg img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; cursor:zoom-in; animation:fade .3s}
.gbtn{position:absolute; top:50%; translate:0 -50%; z-index:2; width:42px; height:42px; border-radius:50%; cursor:pointer; color:#fff; font-size:26px; line-height:1; padding:0 0 3px; display:grid; place-items:center;
  background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.35); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.gbtn:hover{background:rgba(0,0,0,.68)}
.gbtn.l{left:10px} .gbtn.r{right:10px}
.gcount{position:absolute; right:12px; bottom:10px; z-index:2; font-size:12px; padding:3px 10px; border-radius:999px; background:rgba(0,0,0,.5); color:#fff; pointer-events:none}
.gthumbs{display:flex; gap:8px; overflow-x:auto; padding:10px 2px 4px; width:0; min-width:100%; scrollbar-width:thin}
.gt{flex:none; position:relative; width:74px; height:54px; border-radius:12px; overflow:hidden; padding:0; cursor:pointer; border:2px solid transparent; opacity:.6; background:#000; transition:opacity .2s,border-color .2s}
.gt img{width:100%; height:100%; object-fit:cover; display:block}
.gt:hover{opacity:.9}
.gt.on{opacity:1; border-color:rgba(255,255,255,.9)}
.gplay{position:absolute; inset:0; display:grid; place-items:center; font-size:18px; color:#fff; background:rgba(0,0,0,.35)}
.lb{position:fixed; inset:0; z-index:90; display:grid; place-items:center; background:rgba(3,4,10,.95); animation:fade .25s}
.lb img{max-width:96vw; max-height:94vh; object-fit:contain; border-radius:8px; cursor:zoom-out}
.lbc{position:absolute; bottom:14px; left:50%; translate:-50% 0; color:#fff; font-size:13px; text-shadow:0 1px 4px #000}

/* ---------- «También hago esto» (enlaces a otras páginas) ---------- */
.also{margin:64px auto 8px; text-align:center}
.also .kick{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:16px}
.also .row{display:flex; flex-wrap:wrap; gap:14px; justify-content:center}
.also-card{display:flex; align-items:center; gap:16px; padding:18px 24px; border-radius:26px; color:var(--text); text-decoration:none; text-align:left; max-width:420px; transition:transform .35s var(--ease), box-shadow .35s var(--ease)}
.also-card:hover{transform:translateY(-4px) scale(1.015)}
.also-card b{display:block; font-size:19px; letter-spacing:-.02em}
.also-card small{display:block; margin-top:3px; color:var(--muted); font-size:13.5px; line-height:1.4}
.also-card .arr{flex:none; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.14); font-size:18px; transition:transform .35s var(--ease)}
.also-card:hover .arr{transform:translateX(4px)}
.back{position:fixed; left:14px; top:14px; z-index:30; display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:999px; color:var(--text); text-decoration:none; font-size:14px; transition:transform .25s var(--ease), background .25s}
.back:hover{transform:translateX(-3px); background:rgba(255,255,255,.16)}

/* ---------- Botón de sonido ---------- */
.snd{position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:30; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; padding:0; cursor:pointer; color:var(--text); font-size:17px; line-height:1; opacity:.75; transition:opacity .25s,transform .25s var(--ease)}
.snd:hover{opacity:1; transform:scale(1.08)}
.snd.off{opacity:.45}

/* ---------- Portadas: borroso diminuto → versión chica → versión grande ---------- */
.thumb,.sl{background-size:cover; background-position:center}
.thumb img.fade{opacity:0; transition:opacity .5s var(--ease),transform .5s}
.thumb img.fade.ok{opacity:1}

/* ---------- Modo liviano (se activa solo en conexiones/equipos muy justos) ---------- */
.lite .bg i{animation:none; filter:blur(60px)}
.lite .glass{-webkit-backdrop-filter:none; backdrop-filter:none; background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.08))}
.lite .card.gold,.lite .card.gold::before{animation:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
/* ---------- Tarjetas de tamaño fijo + títulos largos ---------- */
:root{--info-h:142px}
.card{height:calc(var(--th) + var(--info-h) + 20px); overflow:hidden}
.card.h{display:flex; flex-direction:column}
.card.h .info{flex:1; min-height:0; overflow:hidden}
.info h3{white-space:nowrap; overflow:hidden; line-height:1.3}
.info h3 .t{display:inline-block; transform:translateX(0); transition:transform .35s ease}
.info h3.ov{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 38px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 38px),transparent)}
.card:hover .info h3.ov,.card:focus-visible .info h3.ov{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent); mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.card:hover .info h3.ov .t,.card:focus-visible .info h3.ov .t{transform:translateX(calc(var(--sx) * -1)); transition:transform calc(var(--dur) * 1s) linear .25s}
.info .meta{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tags,.tools{flex-wrap:nowrap; overflow:hidden}
.tag{flex:none; white-space:nowrap}
.tool{flex:none}
.tags{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
/* ---------- Stacks de clientes + carpeta ---------- */
.thumb.stackthumb{overflow:visible; background:transparent}
.stackthumb .sl{position:absolute; left:0; right:0; top:0; bottom:0; border-radius:16px; overflow:hidden; background:#111; transition:transform .55s var(--ease), filter .4s}
.stackthumb .sl img{width:100%; height:100%; object-fit:cover; display:block}
.stackthumb .sl.l0{z-index:3; top:18px}
.stackthumb .sl.l1{z-index:2; top:9px; left:11px; right:11px; bottom:9px; filter:brightness(.72); border-radius:14px}
.stackthumb .sl.l2{z-index:1; top:0; left:22px; right:22px; bottom:18px; filter:brightness(.5); border-radius:12px}
.stackthumb.one .sl.l0{top:0}
.stackthumb .dur{z-index:4}
.stackthumb.v .sl.l1{left:8px; right:8px}
.stackthumb.v .sl.l2{left:16px; right:16px}
.card.stack:hover .sl.l0{transform:translateY(3px)}
.card.stack:hover .sl.l1{transform:translate(-9px,-4px) rotate(-3deg); filter:brightness(.85)}
.card.stack:hover .sl.l2{transform:translate(10px,-7px) rotate(3.5deg); filter:brightness(.7)}
.folder{position:fixed; inset:0; z-index:45; display:none; align-items:center; justify-content:center; padding:20px;
  background:rgba(5,5,15,.5); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
.folder.open{display:flex; animation:fade .25s}
.folder.closing{animation:fadeout .3s both}
.fpanel{width:min(1280px,100%); max-height:92vh; overflow:auto; padding:32px 24px 24px; transform-origin:var(--ox,50%) var(--oy,50%); animation:folderIn .6s var(--ease) both}
.folder.closing .fpanel{animation:folderOut .3s var(--ease) both}
@keyframes folderIn{from{opacity:0; transform:scale(.3); filter:blur(10px)}}
@keyframes folderOut{to{opacity:0; transform:scale(.4); filter:blur(8px)}}
.fhead{max-width:820px; margin:0 auto 28px; text-align:center}
.fkicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.fhead h2{margin:6px 0 8px; font-size:clamp(30px,5vw,54px); letter-spacing:-.04em; line-height:1.05}
.fhead .desc{margin:16px auto 0; max-width:680px}
.fhead .btn{margin-top:18px}
.fpanel .grid{padding-bottom:6px}
</style>

    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }

const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
function dateParts(v) { // devuelve {y, mo, d} si v.date es una fecha completa válida; si no, null
  const m = DATE_RE.exec(String((v && v.date) || "").trim());
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3], t = new Date(Date.UTC(y, mo - 1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === mo - 1 && t.getUTCDate() === d ? { y, mo, d } : null;
}
// valor para ordenar: fecha completa tal cual; solo año = 31 de diciembre de ese año; sin fecha = 0
const vSort = v => { const p = dateParts(v); return p ? Date.UTC(p.y, p.mo - 1, p.d) : (Number(v.year) ? Date.UTC(Number(v.year), 11, 31) : 0); };

const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fmtDate = (v, long) => {
  const p = dateParts(v);
  if (!p) return v.year ? String(v.year) : "";
  if (!long) return `${p.d} ${MES[p.mo - 1]} ${p.y}`;
  return new Date(Date.UTC(p.y, p.mo - 1, p.d)).toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
};

function parseVideo(url) {
  if (!url) return null;
  let m;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/)))
    return { type: "iframe", src: `https://www.youtube.com/embed/${m[1]}?autoplay=1&rel=0`, thumb: `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` };
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/)))
    return { type: "iframe", src: `https://player.vimeo.com/video/${m[1]}?autoplay=1` };
  if ((m = url.match(/sketchfab\.com\/(?:3d-models\/(?:[\w-]*-)?|models\/)([0-9a-f]{32})/i)))
    return { type: "iframe", src: `https://sketchfab.com/models/${m[1]}/embed?autostart=1&ui_theme=dark` };
  if ((m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/)))
    return { type: "iframe", src: `https://drive.google.com/file/d/${m[1]}/preview` };
  if (/\.(mp4|webm|mov)(\?|$)/i.test(url)) return { type: "file", src: url };
  return { type: "link", src: url };
}

}

  const tone = (f0, f1, dur, vol, type, at = 0) => {
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  };
  const SFX = {
    chip: () => { tone(520, 760, .09, .05, "sine"); tone(1040, 1400, .07, .018, "triangle", .005); },          // toque de sección: "tic" suave
    open: () => { tone(523, 784, .34, .05, "sine"); tone(784, 1175, .4, .03, "sine", .045); tone(1568, 1568, .2, .01, "triangle", .06); }, // portada: campanita de vidrio
    close: () => { tone(620, 380, .13, .04, "sine"); },                                                         // cerrar: baja suave
    /* foto de perfil: «¡Hey! … ¡Listen!» de hada — un chillido agudo que sube y un aleteo de tres notas (sonido original, sintetizado) */
    hey: () => {
      tone(1500, 2250, .15, .05, "sine"); tone(3000, 4500, .13, .012, "triangle", .005); tone(1500, 2250, .15, .02, "sine", .03);
      tone(1760, 2100, .09, .045, "sine", .34); tone(1480, 1760, .09, .045, "sine", .45); tone(1175, 1760, .2, .05, "sine", .56); tone(2350, 3520, .18, .012, "triangle", .57);
    }
  };
  window.sfx = name => {
    if (!on || !AC) return;
    try { if (!ctx) ctx = new AC(); if (ctx.state === "suspended") ctx.resume(); SFX[name](); } catch (e) {}
  };
  btn.addEventListener("click", () => { on = !on; try { localStorage.setItem(key, on ? "1" : "0"); } catch (e) {} paint(); if (on) sfx("chip"); });
  paint();
  const av = $("#avatar");
  av.classList.add("tap"); av.setAttribute("role", "button"); av.tabIndex = 0; av.setAttribute("aria-label", "Saludar");
  const hey = () => { av.classList.remove("boing"); void av.offsetWidth; av.classList.add("boing"); sfx("hey"); };
  av.addEventListener("click", hey);
  av.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hey(); } });
  av.addEventListener("animationend", e => { if (e.animationName === "boing") av.classList.remove("boing"); });
  document.addEventListener("click", e => {
    const t = e.target; if (!t.closest || t.closest("#snd")) return;
    if (t.closest(".chip")) sfx("chip");
    else if (t.closest(".card")) sfx("open");
    else if (t.closest(".close") || t.classList.contains("overlay") || t.classList.contains("folder")) sfx("close");
  }, true);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && (($("#overlay") || {}).classList || { contains: () => false }).contains("open")) sfx("close");
    else if (e.key === "Enter" && e.target.classList && e.target.classList.contains("card")) sfx("open");
  });
}

renderFilters(); renderGrid();

/* ---------- «También hago esto» (enlaces a otras páginas) y botón de volver ---------- */
{
  const also = (CONFIG.also || []).filter(a => a && a.label && a.url);
  if (also.length) {
    $("#alsoTitle").textContent = CONFIG.alsoTitle || "También hago esto";
    also.forEach(a => $("#alsoRow").append(h("a", { class: "also-card glass", href: a.url }, h("div", {}, h("b", {}, a.label), a.desc ? h("small", {}, a.desc) : null), h("span", { class: "arr" }, "→"))));
    $("#also").hidden = false;
  }
  if (CONFIG.backUrl) document.body.append(h("a", { class: "back glass", href: CONFIG.backUrl }, CONFIG.backLabel || "← Volver"));
  if (!VIDEOS.length) { $("#filters").hidden = true; $("#grid").style.minHeight = "0"; $("#empty").textContent = CONFIG.emptyText || "Pronto vas a ver acá mis trabajos."; $("#empty").hidden = false; }
}
</script>
</body>
