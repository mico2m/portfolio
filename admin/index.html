<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constructor de portfolio</title>
<style>
:root{--text:#f5f6ff;--muted:rgba(245,246,255,.66);--stroke:rgba(255,255,255,.2);--ease:cubic-bezier(.2,.9,.25,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);background:#0a0a17;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:float 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:#6d4aff}
.bg i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:10vh;background:#ff4f9a;animation-delay:-6s}
.bg i:nth-child(3){width:50vw;height:50vw;left:25vw;bottom:-25vw;background:#18c6ff;animation-delay:-12s}
@keyframes float{to{transform:translate(6vw,5vh) scale(1.15)}}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.07),0 12px 40px rgba(0,0,0,.35);border-radius:24px}

.top{position:sticky;top:12px;z-index:30;margin:12px auto 0;width:calc(100% - 24px);max-width:1500px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;border-radius:22px}
.top b{font-size:16px;letter-spacing:-.01em}
.top small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:13.5px;color:#fff;cursor:pointer;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:all .25s var(--ease)}
.btn:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,rgba(124,92,255,.85),rgba(255,95,162,.8));border-color:rgba(255,255,255,.5);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:12.5px}

.tabs{display:none;margin:14px auto 0;width:calc(100% - 24px);gap:8px}
.app{max-width:1500px;margin:16px auto 50px;padding:0 12px;display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:16px;align-items:start}
.formcol{display:flex;flex-direction:column;gap:16px}
.sec{padding:20px}
.sec h2{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:-.01em;user-select:none}
.acc>summary::-webkit-details-marker{display:none}
.acc .cnt{font-size:12px;font-weight:500;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.75)}
.acc .chev,.cd .chev{margin-left:auto;font-size:22px;line-height:1;opacity:.7;transition:transform .25s}
.acc[open]>summary .chev,.cd[open]>summary .chev{transform:rotate(90deg)}
.acc:not([open]){padding-top:14px;padding-bottom:14px}
.accb{padding-top:8px}
.accb>p{margin:0 0 6px;color:rgba(255,255,255,.65);font-size:13px;line-height:1.5}
.how{margin:8px 0 0;padding-left:20px;color:rgba(255,255,255,.65);font-size:13.5px;line-height:1.7}
.how b{color:#fff}
.cd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.cd>summary::-webkit-details-marker{display:none}
.cd small{color:rgba(255,255,255,.55);font-size:12px}
.cd .cdb{margin-top:10px}
.cdh{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cdh input{flex:1;min-width:160px}
.sec>p{margin:0 0 6px;color:var(--muted);font-size:13px;line-height:1.5}
.intro ol{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:13.5px;line-height:1.7}
.intro b{color:var(--text)}
.f{margin-top:12px;min-width:0}
.f>label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
small{color:var(--muted);font-size:11.5px;line-height:1.4}
.f>small{display:block;margin-top:4px}
input,select,textarea{width:100%;font:inherit;font-size:14px;color:#fff;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);outline:none;transition:border-color .2s,background .2s}
input[type=date]{color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:rgba(255,255,255,.65);background:rgba(255,255,255,.12)}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.35)}
select option{color:#111}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cl{border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px;margin-top:10px;background:rgba(255,255,255,.04)}
.rowc{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.cl>input,.cl>textarea{margin-top:8px}
.three{display:grid;grid-template-columns:1.5fr 1fr 1.3fr;gap:10px}
.rowg{display:grid;grid-template-columns:130px 1fr 1.4fr auto;gap:8px;margin-top:10px;align-items:center}
.rowl{display:grid;grid-template-columns:1fr 1.6fr auto;gap:8px;margin-top:10px;align-items:center}
.rowt{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;margin-top:10px;align-items:center}
.ib{width:30px;height:30px;padding:0;display:grid;place-items:center;font:inherit;font-size:14px;color:#fff;cursor:pointer;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);transition:all .2s}
.ib:hover{background:rgba(255,255,255,.25)}
.add{margin-top:14px}

.row-av{display:flex;gap:16px;align-items:center}
.avatar-prev{width:84px;height:84px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:26px;flex:none;background:linear-gradient(135deg,#7b5cff,#ff5fa2);border:2px solid rgba(255,255,255,.35)}
.avatar-prev img{width:100%;height:100%;object-fit:cover}
.row-av .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-av small{flex-basis:100%}
.tprev{width:30px;height:30px;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-size:11px;font-weight:800;background:#2a2a35}
.tprev img{width:100%;height:100%;object-fit:cover}

.vc{margin-top:12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);overflow:hidden}
.vc.open{background:rgba(255,255,255,.09)}
.vhead{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.vthumb{width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:13px;color:var(--muted)}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vt{flex:1;min-width:0}
.vt b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vact{display:flex;gap:5px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:14px}
.vtile{font:inherit;color:#fff;text-align:left;cursor:pointer;padding:0;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);transition:transform .25s var(--ease),background .25s,border-color .25s}
.vtile:hover,.vtile:focus-visible{transform:translateY(-2px);background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.4);outline:none}
.vimg{position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,rgba(109,74,255,.45),rgba(255,79,154,.4));color:rgba(255,255,255,.75);font-size:20px}
.vimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vbadge{position:absolute;top:5px;left:5px;font-size:10px;line-height:1.4;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
.vbadge.r{left:auto;right:5px;top:auto;bottom:5px}
.vmeta{padding:6px 8px 8px;min-height:50px}
.vmeta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;line-height:1.25}
.vmeta b.no{color:var(--muted);font-weight:500;font-style:italic}
.vmeta small{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.vplus{align-items:center;justify-content:center;gap:2px;border-style:dashed;background:transparent;border-color:rgba(255,255,255,.4);min-height:96px}
.vplus .plus{font-size:34px;line-height:1;font-weight:300}
.vplus small{font-size:11px}
.vedit .vebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vedit .vhead{cursor:default;padding:16px 0 8px}
.vedit .vthumb{width:76px;height:48px}
.vfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.vfoot .sp{flex:1}
.btn.danger{color:#ffb4c0;border-color:rgba(255,120,150,.5)}
.btn:disabled{opacity:.4;pointer-events:none}
.vbody{padding:2px 14px 16px}
.vbody[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{font:inherit;font-size:12px;color:#fff;cursor:pointer;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
.mini.on{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.55)}
.covwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.gtile{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;font-size:22px}
.gtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gtile .gb{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.gtile .gb button{font:inherit;font-size:11px;color:#fff;cursor:pointer;border:0;border-radius:8px;padding:3px 6px;background:rgba(255,255,255,.18)}
.gtile .gb button:hover{background:rgba(255,255,255,.34)}
.gtile .gb .gcv{flex:1 0 100%;background:rgba(212,160,23,.85);color:#201500;font-weight:600}
.gtile .gtag{position:absolute;top:5px;left:5px;font-size:10px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.6)}
.gtile .gtag.cv{background:#d4a017;color:#201500}
.gempty{padding:14px;border:1px dashed rgba(255,255,255,.25);border-radius:12px;color:rgba(255,255,255,.6);font-size:13px;margin-bottom:10px}
.cov{border-radius:12px;overflow:hidden;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.3);display:grid;place-items:center;color:var(--muted);font-size:12px}
.cov[data-o="horizontal"]{aspect-ratio:16/9;width:190px}
.cov[data-o="vertical"]{aspect-ratio:9/16;width:100px}
.cov[data-o="cuadrado"]{aspect-ratio:1/1;width:140px}
.cov img{width:100%;height:100%;object-fit:cover}
.covbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:230px}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.ck{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.ck input{width:auto;margin:0}
.empty{color:var(--muted);font-size:13px;padding:14px 0 2px}

.preview{position:sticky;top:78px;height:calc(100vh - 98px);display:flex;flex-direction:column;overflow:hidden}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.12);flex-wrap:wrap}
.pbar b{font-size:14px}
.pwrap{flex:1;display:flex;justify-content:center;background:rgba(0,0,0,.25);min-height:0}
.pwrap iframe{width:100%;height:100%;border:0;background:#0a0a17;transition:width .4s var(--ease)}
.pwrap.phone iframe{width:390px;max-width:100%}

.ovl{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(5,5,15,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ovl .sec{width:min(520px,100%);max-height:92vh;overflow:auto}
.ovl h3{margin:0 0 4px;font-size:18px}
.ovl p.n{margin:6px 0 0;font-size:13px;color:rgba(255,255,255,.65);line-height:1.5}
.ovl .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#toast{position:fixed;left:50%;bottom:24px;z-index:80;transform:translate(-50%,30px);opacity:0;pointer-events:none;padding:12px 20px;border-radius:999px;max-width:calc(100% - 30px);font-size:14px;text-align:center;transition:all .4s var(--ease);background:rgba(30,30,55,.85);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .tabs{display:flex}
  .tabs .btn{flex:1}
  .app[data-tab="edit"] .preview{display:none}
  .app[data-tab="view"] .formcol{display:none}
  .preview{position:relative;top:0;height:78vh}
  .rowg{grid-template-columns:1fr 1fr;}
  .rowg .ib{justify-self:end}
}
@media(max-width:520px){.three,.two{grid-template-columns:1fr}.rowl{grid-template-columns:1fr 1fr auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<header class="top glass">
  <div><b>Constructor de portfolio</b><small id="saved">Tus cambios se guardan solos en este navegador</small></div>
  <div class="acts">
    <button class="btn ghost" id="pull" type="button">↻ Traer lo publicado</button>
    <button class="btn ghost" id="cfg" type="button">⚙ Conexión</button>
    <button class="btn ghost" id="load" type="button">Cargar proyecto</button>
    <button class="btn ghost" id="saveJson" type="button">Guardar proyecto</button>
    <button class="btn primary" id="export" type="button">🚀 Publicar</button>
  </div>
</header>

<div class="tabs">
  <button class="btn" id="tabEdit" type="button">Editar</button>
  <button class="btn ghost" id="tabView" type="button">Vista previa</button>
</div>

<div class="app" id="app" data-tab="edit">
  <div class="formcol" id="form"></div>
  <section class="preview glass">
    <div class="pbar">
      <b>Vista previa en vivo <small id="size"></small></b>
      <div style="display:flex;gap:6px">
        <button class="btn sm" id="devD" type="button">Escritorio</button>
        <button class="btn sm ghost" id="devP" type="button">Celular</button>
      </div>
    </div>
    <div class="pwrap" id="pwrap"><iframe id="pv" title="Vista previa del portfolio"></iframe></div>
  </section>
</div>
<div id="toast"></div>

<script>
/* La plantilla del portfolio va embebida acá (se completa al armar este archivo) */
const TEMPLATE = "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Mirco Moreyra · Editor de video<\/title>\n<meta name=\"description\" content=\"Adaptado de cualquier tipo de contenido.\">\n<style>\n:root{\n  --text:#f5f6ff; --muted:rgba(245,246,255,.66);\n  --stroke:rgba(255,255,255,.2);\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{\n  margin:0; min-height:100vh; color:var(--text); background:#0a0a17;\n  font-family:-apple-system,BlinkMacSystemFont,\"Inter\",\"Segoe UI\",system-ui,sans-serif;\n  -webkit-font-smoothing:antialiased; overflow-x:hidden;\n}\nbody.locked{overflow:hidden}\n\n/* ---------- Fondo con manchas de color (lo que hace brillar el vidrio) ---------- */\n.bg{position:fixed; inset:0; z-index:-1; overflow:hidden}\n.bg i{position:absolute; border-radius:50%; filter:blur(90px); opacity:.65; animation:float 22s ease-in-out infinite alternate; will-change:transform,translate}\n.bg i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:#6d4aff}\n.bg i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:10vh;background:#ff4f9a;animation-delay:-6s}\n.bg i:nth-child(3){width:50vw;height:50vw;left:25vw;bottom:-25vw;background:#18c6ff;animation-delay:-12s}\n.bg i:nth-child(4){width:30vw;height:30vw;right:15vw;bottom:5vh;background:#ffb347;opacity:.4;animation-delay:-3s}\n@keyframes float{to{transform:translate(6vw,5vh) scale(1.15)}}\n\n/* ---------- Liquid glass ---------- */\n.glass{\n  position:relative;\n  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));\n  -webkit-backdrop-filter:blur(22px) saturate(180%);\n  backdrop-filter:blur(22px) saturate(180%);\n  border:1px solid var(--stroke);\n  box-shadow:\n    inset 0 1px 0 rgba(255,255,255,.5),\n    inset 0 -1px 0 rgba(255,255,255,.08),\n    inset 0 0 24px rgba(255,255,255,.05),\n    0 12px 40px rgba(0,0,0,.35);\n  border-radius:26px;\n}\n/* reflejo especular que sigue al mouse */\n.glass::after{\n  content:\"\"; position:absolute; inset:0; border-radius:inherit; pointer-events:none;\n  background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.22),transparent 60%);\n  opacity:0; transition:opacity .3s;\n}\n.glass:hover::after{opacity:1}\n\n/* ---------- Layout ---------- */\n.wrap{max-width:1700px; margin:0 auto; padding:0 20px}\nnav{position:sticky; top:14px; z-index:20; margin:14px auto 0; width:fit-content; max-width:calc(100% - 24px);\n  display:flex; align-items:center; justify-content:center; padding:7px 8px; border-radius:999px;\n  animation:drop .9s var(--ease) both}\nnav .links{display:flex; gap:4px; flex-wrap:wrap; justify-content:center}\nnav a{color:var(--text); text-decoration:none; font-size:14px; padding:7px 14px; border-radius:999px; transition:background .2s}\nnav a:hover{background:rgba(255,255,255,.14)}\n\n.hero{padding:56px 0 36px; text-align:center; display:flex; flex-direction:column; align-items:center}\n.avatar{width:144px; height:144px; border-radius:50%; padding:6px; margin-bottom:26px;\n  animation:rise 1s var(--ease) .1s both, bob 6s ease-in-out 1.2s infinite alternate}\n.avatar-in{width:100%; height:100%; border-radius:50%; overflow:hidden; display:grid; place-items:center;\n  font-size:48px; font-weight:700; letter-spacing:-.04em; background:linear-gradient(135deg,#7b5cff,#ff5fa2)}\n.avatar-in img{width:100%; height:100%; object-fit:cover; display:block}\n.hero h1{font-size:clamp(40px,8vw,84px); line-height:1.02; letter-spacing:-.045em; margin:0 0 16px;\n  background:linear-gradient(180deg,#fff,rgba(255,255,255,.62)); -webkit-background-clip:text; background-clip:text; color:transparent}\n.role{display:inline-block; font-size:13px; letter-spacing:.14em; text-transform:uppercase; padding:7px 18px; margin-bottom:20px; border-radius:999px;\n  background:rgba(255,255,255,.1); border:1px solid var(--stroke); box-shadow:inset 0 1px 0 rgba(255,255,255,.4 y:0; translate:0 40px; scale:.95}\n.card.reveal.in{opacity:1; translate:0 0; scale:1}\n.card:hover{transform:translateY(-6px) scale(1.012)}\n.thumb{position:relative; width:100%; overflow:hidden; border-radius:18px; background:#111}\n.thumb.h{aspect-ratio:16/9}\n.thumb.v{aspect-ratio:9/16}\n.thumb.s{aspect-ratio:1/1}\n.thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s}\n.card:hover .thumb img{transform:scale(1.05)}\n.play{position:absolute; inset:0; display:grid; place-items:center}\n.play span{width:56px; height:56px; border-radius:50%; display:grid; place-items:center;\n  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.5);\n  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.7); opacity:0; transform:scale(.85); transition:all .3s}\n.card:hover .play span{opacity:1; transform:none}\n.play svg{width:22px; height:22px; fill:#fff; margin-left:3px}\n.dur{position:absolute; right:10px; bottom:10px; font-size:12px; font-weight:600; padding:4px 9px; border-radius:999px;\n  background:rgba(0,0,0,.45); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.2)}\n.fmt{position:absolute; left:10px; top:10px; font-size:11px; padding:3px 9px; border-radius:999px;\n  background:rgba(0,0,0,.4); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.18)}\n\n.info{padding:12px 8px 6px}\n.info h3{margin:0 0 4px; font-size:17px; letter-spacing:-.01em}\n.meta{font-size:13px; color:var(--muted)}\n.meta b{color:var(--text); font-weight:600}\n.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}\n.tag{font-size:11.5px; padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16)}\n.tools{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}\n.tool{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; font-size:12px; font-weight:800;\n  letter-spacing:-.04em; overflow:hidden}\n.tool img{width:100%; height:100%; object-fit:cover}\n.empty{text-align:center; color:var(--muted); padding:60px 0}\n\nfooter{text-align:center; color:var(--muted); font-size:13px; padding:20px 0 40px}\n\n/* ---------- Modal ---------- */\n.overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px;\n  background:rgba(5,5,15,.55); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}\n.overlay.open{display:flex; animation:fade .25s}\n@keyframes fade{from{opacity:0}}\n.panel{width:min(1100px,100%); max-height:92vh; overflow:auto; padding:18px; animation:pop .35s cubic-bezier(.2,.8,.2,1)}\n@keyframes pop{from{transform:translateY(20px) scale(.97); opacity:0}}\n.close{position:absolute; top:14px; right:14px; z-index:3; width:38px; height:38px; border-radius:50%; cursor:pointer; color:#fff; font-size:20px;\n  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}\n.close:hover{background:rgba(255,255,255,.3)}\n.mbody{display:grid; gap:24px; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); align-items:start}\n.mbody.vert{grid-template-columns:auto minmax(0,1fr)}\n.player{position:relative; width:100%; border-radius:18px; overflow:hidden; background:#000; aspect-ratio:16/9}\n.player.v{aspect-ratio:9/16; height:min(78vh,720px); width:auto}\n.player.s{aspect-ratio:1/1}\n.player iframe,.player video{position:absolute; inset:0; width:100%; height:100%; border:0}\n.player .ph{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px; color:var(--muted); gap:12px}\n.btn{display:inline-block; color:#fff; text-decoration:none; padding:10px 20px; border-radius:999px; font-size:14px; cursor:pointer;\n  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}\n argin:0; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--text); cursor:pointer}\n.checks input{width:auto}\n.out{font-family:ui-monospace,Menlo,monospace; font-size:12px; min-height:140px}\n.row{display:grid; grid-template-columns:1fr 1fr; gap:10px}\n/* ---------- Destacados: brillo dorado dentro de la tarjeta ---------- */\n.card.gold{\n  overflow:hidden;\n  border-color:rgba(255,213,100,.8);\n  background:linear-gradient(135deg,rgba(255,215,120,.24),rgba(255,176,40,.07));\n  box-shadow:\n    inset 0 1px 0 rgba(255,240,190,.85),\n    inset 0 0 30px rgba(255,200,70,.38),\n    inset 0 0 80px rgba(255,165,30,.14),\n    0 12px 40px rgba(0,0,0,.35);\n  animation:goldPulse 3.8s ease-in-out infinite alternate;\n}\n@keyframes goldPulse{\n  from{box-shadow:inset 0 1px 0 rgba(255,240,190,.7),inset 0 0 22px rgba(255,200,70,.26),inset 0 0 60px rgba(255,165,30,.08),0 12px 40px rgba(0,0,0,.35)}\n  to{box-shadow:inset 0 1px 0 rgba(255,245,205,.95),inset 0 0 38px rgba(255,205,80,.5),inset 0 0 95px rgba(255,170,30,.2),0 12px 40px rgba(0,0,0,.35)}\n}\n/* destello que cruza la tarjeta: una franja que se desliza y se desvanece (sin saltos al reiniciar) */\n.card.gold::before{\n  content:\"\"; position:absolute; top:-10%; bottom:-10%; left:-60%; width:50%; z-index:3; pointer-events:none; opacity:0;\n  background:linear-gradient(100deg,transparent,rgba(255,238,175,.42) 50%,transparent);\n  transform:skewX(-18deg);\n  animation:sheen 6.5s linear infinite;\n  animation-delay:calc(var(--d,0s)*8);\n}\n@keyframes sheen{\n  0%,40%{translate:0 0; opacity:0; animation-timing-function:cubic-bezier(.45,0,.25,1)}\n  48%{opacity:1}\n  90%{opacity:1}\n  100%{translate:440% 0; opacity:0}\n}\n.card.gold .info h3{color:#ffe7a3; text-shadow:0 0 18px rgba(255,200,70,.35)}\n.card.gold .tag{background:rgba(255,205,90,.16); border-color:rgba(255,215,120,.4)}\n.star{position:absolute; right:10px; top:10px; z-index:2; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;\n  font-size:14px; color:#4a3000; background:linear-gradient(135deg,#fff1b8,#ffc93c); box-shadow:0 0 14px rgba(255,200,60,.8),inset 0 1px 0 rgba(255,255,255,.8)}\n.chip.feat{color:#ffe7a3; border-color:rgba(255,213,100,.65); background:rgba(255,200,70,.14); box-shadow:inset 0 1px 0 rgba(255,240,190,.6),0 0 18px rgba(255,190,50,.22)}\n.chip.feat.on{background:rgba(255,205,80,.32); border-color:rgba(255,225,130,.95); box-shadow:inset 0 1px 0 rgba(255,245,205,.9),0 0 26px rgba(255,190,50,.45)}\n\n/* ---------- Redes sociales ---------- */\n.socials{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:26px}\n.social{width:46px; height:46px; border-radius:50%; display:grid; place-items:center; color:var(--text); text-decoration:none;\n  font-size:15px; font-weight:700; transition:transform .35s var(--ease)}\n.social:hover{transform:translateY(-4px) scale(1.1)}\n.social svg{width:21px; height:21px; display:block}\n.social b{letter-spacing:-.03em}\n.filters{scroll-margin-top:90px}\n#grid{min-height:calc(100vh - 170px)} /* deja siempre espacio para que el paneo pueda subir los filtros, aunque la sección tenga pocos videos */\n\n/* ---------- Animaciones ---------- */\n:root{--ease:cubic-bezier(.2,.9,.25,1)}\n@keyframes rise{from{opacity:0; transform:translateY(26px) scale(.97); filter:blur(10px)}}\n@keyframes drop{from{opacity:0; transform:translateY(-30px)}}\n@keyframes bob{to{translate:0 -9px}}\n/* foto de perfil: al tocarla rebota (salta, se aplasta y se estira) */\n.avatar.tap{cursor:pointer; -webkit-tap-highlight-color:transparent}\n.avatar.boing{animation:rise 1s var(--ease) .1s both, bob 6s ease-in-out 1.2s infinite alternate, boing .95s cubic-bezier(.3,.7,.4,1)}\n@keyframes boing{\n  0%{transform:scale(1,1)}\n  12%{transform:translateY(4px) scale(1.14,.84)}\n  30%{transform:translateY(-38px) scale(.9,1.12)}\n  48%{transform:translateY(0) scale(1.1,.9)}\n  62%{transform:translateY(-14px) scale(.97,1.04)}\n  78%{transform:t async function compress(file, { max = 1100, square = 0, png = false, webp = false, q = .82 } = {}) {

}

    const c = v.cover;
    if (!c || !c.startsWith("data:image/") || c.length < 60000) continue;
    try {
      const blob = await (await fetch(c)).blob();
      const max = v.orientation === "vertical" ? 640 : v.orientation === "cuadrado" ? 600 : 800;
      const d = await compress(blob, { max, q: .78, webp: true });

      if (d.length < c.length * 0.9) { v.cover = d; after += d.length; n++; } else after += c.length;

/* orden de la lista de videos (solo cambia cómo se ve acá; en el sitio las portadas se ordenan por año solas) */
const SORTS = [["fecha", "Fecha: más nuevos primero"], ["fechaAsc", "Fecha: más viejos primero"], ["cliente", "Cliente (A–Z)"], ["anio", "Año"], ["tipo", "Tipo / categoría"], ["titulo", "Título (A–Z)"], ["destacados", "Destacados primero"], ["manual", "Mi orden manual"]];

function sortedVideos() {
  const L = S.videos.slice(), byDate = (x, y) => emptyLast(dateKey(x), dateKey(y), (a, b) => txt(b, a)) || txt(x.title, y.title);
  const firstCat = v => parseCats(v.category)[0] || "";
  const by = {
    fecha: byDate,
    fechaAsc: (x, y) => emptyLast(dateKey(x), dateKey(y), txt) || txt(x.title, y.title),
